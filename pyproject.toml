[project]
name = "llm-council-cli"
version = "0.3.0"
description = "An LLM council in your terminal — Claude Code, Codex, and Ollama cloud deliberate, peer-rank, and synthesize an answer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Parikshit Joon" }]
keywords = ["llm", "cli", "tui", "claude", "codex", "ollama", "agents", "council"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "textual>=0.80.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/speedcuber911/council"
Repository = "https://github.com/speedcuber911/council"
Issues = "https://github.com/speedcuber911/council/issues"

[project.scripts]
council = "council.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["council"]

[tool.hatch.build.targets.sdist]
include = ["council", "README.md", "LICENSE"]
